<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up – WeHear</title>
<meta name="description" content="Sign up to take part in the WeHear video recordings at DTU Hearing Systems.">
<link rel="icon" type="image/png" href="wehear_logo_white.png">
<style>
  :root {
    --blue: #00509E;
    --blue-dark: #003B75;
    --ink: #14202E;
    --muted: #4A5868;
    --line: #C9D3DF;
    --error: #B42318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--blue);
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 40px;
  }
  .wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  header img { width: 120px; height: auto; display: block; }
  h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; }
  header p { margin: 0; font-size: 17px; color: #E3ECF7; }

  .card {
    background: #FFFFFF;
    color: var(--ink);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 12px 32px rgba(0, 25, 60, 0.25);
  }
  form { display: flex; flex-direction: column; gap: 20px; margin: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-weight: 600; font-size: 15px; }
  label .opt { font-weight: 400; color: var(--muted); }
  input[type="email"], textarea {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: #FFFFFF;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    min-height: 48px;
  }
  textarea { min-height: 120px; resize: vertical; }
  input[type="email"]:focus, textarea:focus { outline: 3px solid rgba(0, 80, 158, 0.25); border-color: var(--blue); }
  input[aria-invalid="true"] { border-color: var(--error); }
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  .err { font-size: 14px; color: var(--error); margin: 0; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

  button {
    font: inherit;
    font-weight: 700;
    font-size: 17px;
    color: #FFFFFF;
    background: var(--blue);
    border: 0;
    border-radius: 8px;
    min-height: 50px;
    padding: 12px 20px;
    cursor: pointer;
  }
  button:hover { background: var(--blue-dark); }
  button:focus-visible { outline: 3px solid #F2B705; outline-offset: 2px; }
  button[disabled] { opacity: 0.6; cursor: progress; }

  .status { display: none; border-radius: 8px; padding: 14px 16px; font-size: 15px; }
  .status.ok { display: block; background: #E7F4EC; color: #14532D; }
  .status.fail { display: block; background: #FDECEA; color: #7A1A12; }
  .status a { color: inherit; font-weight: 700; }

  nav { display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
  nav a {
    color: #FFFFFF;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 3px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
  }
  nav a:hover { color: #DCE7F5; }
  nav a:focus-visible { outline: 3px solid #F2B705; outline-offset: 2px; border-radius: 4px; }
  footer { text-align: center; font-size: 14px; color: #DCE7F5; }
  footer a { color: #FFFFFF; }

  @media (max-width: 420px) {
    body { padding-top: 32px; }
    .card { padding: 22px 18px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <img src="wehear_logo_white.png" alt="WeHear">
    <h1>Sign up to participate</h1>
    <p>Video recordings for the WeHear research project at DTU Hearing Systems</p>
  </header>

  <section class="card" aria-label="Sign-up form">
    <form id="signup" action="send.php" method="post" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err">
        <p id="email-err" class="err" hidden>Please enter a valid email address.</p>
      </div>
      <div class="field">
        <label for="comments">Comments <span class="opt">(optional)</span></label>
        <textarea id="comments" name="comments" maxlength="2000"></textarea>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit" id="submit">Send</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
  </section>

  <nav aria-label="More information">
    <a href="https://www.healthtech.dtu.dk/research/research-sections/section-hearing-systems" target="_blank" rel="noopener">Learn more about DTU Hearing Systems
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
    </a>
    <a href="https://cordis.europa.eu/project/id/101298706" target="_blank" rel="noopener">Learn more about WeHear
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
    </a>
  </nav>

  <footer>Questions? <a href="mailto:signup@wehear.eu">signup@wehear.eu</a></footer>
</main>

<script>
(function () {
  var TO = 'signup@wehear.eu';
  var SUBJECT = 'participant';
  var form = document.getElementById('signup');
  var email = document.getElementById('email');
  var comments = document.getElementById('comments');
  var err = document.getElementById('email-err');
  var btn = document.getElementById('submit');
  var status = document.getElementById('status');

  function mailtoHref() {
    var body = 'Email: ' + email.value.trim() + '\n\n' + (comments.value.trim() || '');
    return 'mailto:' + TO + '?subject=' + encodeURIComponent(SUBJECT) + '&body=' + encodeURIComponent(body);
  }

  function show(kind, html) {
    status.className = 'status ' + kind;
    status.innerHTML = html;
  }

  email.addEventListener('input', function () {
    if (email.validity.valid) { err.hidden = true; email.removeAttribute('aria-invalid'); }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    status.className = 'status';
    if (!email.value.trim() || !email.validity.valid) {
      err.hidden = false;
      email.setAttribute('aria-invalid', 'true');
      email.focus();
      return;
    }
    err.hidden = true;
    email.removeAttribute('aria-invalid');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (data) {
        if (!data || !data.ok) { return Promise.reject(); }
        form.reset();
        btn.textContent = 'Sent';
        show('ok', 'Thank you! We have received your sign-up and will contact you by email.');
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Send';
        show('fail', 'Your sign-up could not be sent from this page. Please <a href="' + mailtoHref() + '">send it by email instead</a>, or write to ' + TO + '.');
      });
  });
})();
</script>
</body>
</html>
